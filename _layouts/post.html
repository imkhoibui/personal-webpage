---
layout: default
---
<h1>{{ page.title }}</h1>
<div class="blog-post">
    <p style="margin-bottom: 8px;">{{ page.date | date_to_string: "ordinal", "US" }}</p>
    <div style="display: flex; flex-direction: row; margin: 0px 0px 20px;">
        {% for category in page.categories %}
          <div class="thumbnail-categories">{{ category }} </div>
        {% endfor %}
    </div>
    {{ content }}
</div>
